[package]
name = "dumper_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
iced-x86 = "1.21"
goblin = "0.9"
msvc-demangler = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
memchr = "2.7"
ureq = "3.4.2"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pki-types = "1.11"
webpki-roots = "1.0"
roxmltree = "0.21.1"
msi = "0.10.0"
cab = "0.6.0"

